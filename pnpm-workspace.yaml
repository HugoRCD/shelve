packages:
  - 'packages/*'
  - 'apps/*'

shamefullyHoist: true
autoInstallPeers: true
ignoreWorkspaceRootCheck: true

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: false
  unrs-resolver: false
  better-sqlite3: true
  sharp: true

overrides:
  nuxt-og-image: 6.7.0
  magicast: ^0.5.5

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  # Renovate security update: turbo@2.9.14
  - turbo@2.9.14
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
